name: Co-op Sync Listings

on:
  schedule:
    # Every 30 minutes. The job only commits when listings actually change.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: coop-sync-listings
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Sync listings and regenerate README
        working-directory: coop-internships
        run: python main.py sync

      - name: Commit listings + README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coop-internships/listings.json coop-internships/.listings-hash coop-internships/README.md coop-internships/boards
          git diff --staged --quiet || \
            git commit -m "chore: sync co-op listings ($(date -u +%Y-%m-%dT%H:%MZ))"

      - name: Push
        run: git push
